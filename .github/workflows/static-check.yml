name: Portfolio static checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  html-static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required portfolio files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
          grep -q 'id="projects"' index.html
          grep -q 'id="contact"' index.html
