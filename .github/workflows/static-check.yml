name: Portfolio static checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  html-static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check required portfolio files
        run: |
          test -s index.html
          test -s styles.css
          test -s script.js
      - name: Check portfolio sections, anchors and basic accessibility hints
        run: python scripts/check_portfolio.py
